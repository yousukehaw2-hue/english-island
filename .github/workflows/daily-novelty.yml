name: Daily Quest novelty regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check adaptive-engine.js
      - run: node tests/daily-novelty.test.cjs

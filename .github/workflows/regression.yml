name: English Island Regression CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build executable engine test
        run: |
          node ci-runner.js
      - name: Run regression and curriculum validation
        run: |
          node .ci-generated-tests.js

      - name: Verify island growth UI wiring
        run: node island-ui-tests.js
